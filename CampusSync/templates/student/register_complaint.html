{% extends 'base.html' %}

{% block title %}Register Complaint{% endblock %}

{% block content %}
<div class='page-container'>
    <div class='page-header'>
        <h2>Register Complaint</h2>
        <p>Submit a new complaint for review</p>
    </div>

    <form method='POST' enctype='multipart/form-data' class='form-card' novalidate>
        <div class='form-group'>
            <label for='title'>Complaint Title <span class='required'>*</span></label>
            <input type='text' id='title' name='title' maxlength='200'
                   placeholder='Enter complaint title'
                   value='{{ form.get('title', '') }}'>
        </div>

        <div class='form-row'>
            <div class='form-group'>
                <label for='category_id'>Category <span class='required'>*</span></label>
                <select id='category_id' name='category_id'>
                    <option value=''>Select a category</option>
                    {% for cat in categories %}
                    <option value='{{ cat.id }}' {% if form.get('category_id') == cat.id|string %}selected{% endif %}>
                        {{ cat.name }}{% if cat.department %} ({{ cat.department.name }}){% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class='form-group'>
                <label for='department_id'>Department</label>
                <select id='department_id' name='department_id'>
                    <option value=''>Auto-route from category</option>
                    {% for dept in departments %}
                    <option value='{{ dept.id }}' {% if form.get('department_id') == dept.id|string %}selected{% endif %}>{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class='form-group'>
            <label for='description'>Description <span class='required'>*</span></label>
            <textarea id='description' name='description' rows='6' maxlength='2000'
                      placeholder='Describe the issue in detail...'
                      >{{ form.get('description', '') }}</textarea>
        </div>

        <div class='form-group'>
            <label for='attachment'>Attachment (optional)</label>
            <input type='file' id='attachment' name='attachment'>
            <span class='field-help'>You may attach a photo or document supporting the complaint.</span>
        </div>

        <button type='submit' class='btn btn-primary'>Submit Complaint</button>
    </form>
</div>
{% endblock %}
